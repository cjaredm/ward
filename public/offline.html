<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Ward Map</title>
    <!--
      Standalone on purpose: this page is served by the service worker when the
      network is gone, so it can reference no stylesheet, font or script.
    -->
    <style>
      :root { color-scheme: light }
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 1.5rem;
        background: #fafafa; color: #171717;
        font: 400 1rem/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      main { max-width: 26rem; text-align: center }
      h1 { margin: 0 0 .5rem; font-size: 1.125rem; font-weight: 600 }
      p { margin: 0 0 1.5rem; color: #737373; font-size: .875rem }
      button {
        min-height: 2.25rem; padding: 0 .75rem; border: 1px solid #d4d4d4; border-radius: .375rem;
        background: #fff; color: #171717; font: inherit; font-size: .875rem; font-weight: 500;
      }
      button:hover { border-color: #171717 }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>Ward Map needs a connection — parcels, households and callings all live on the server, not on this device.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
